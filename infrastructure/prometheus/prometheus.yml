global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:9000"]

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8081"]

  - job_name: repository-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["repository-service:8082"]

  - job_name: ai-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ai-service:8083"]

  - job_name: ingestion-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ingestion-service:8084"]

  - job_name: analysis-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["analysis-service:8085"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8086"]
