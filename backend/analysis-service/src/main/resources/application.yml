server:
  port: 8085

spring:
  application:
    name: analysis-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: analysis_flyway_schema_history
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always

devmind:
  qdrant-url: ${QDRANT_URL}
  qdrant-collection: ${QDRANT_COLLECTION}
  ai-provider: ${AI_PROVIDER}
  ollama-base-url: ${OLLAMA_BASE_URL}
  ai-model: ${AI_MODEL}
  embedding-model: ${EMBEDDING_MODEL}
  min-relevance-score: ${MIN_RELEVANCE_SCORE}
  search-top-k: ${SEARCH_TOP_K}
  max-context-chunks: ${AI_MAX_CONTEXT_CHUNKS}
  max-answer-tokens: ${AI_MAX_ANSWER_TOKENS}
  auth-service-url: ${AUTH_SERVICE_URL}
  repository-service-url: ${REPOSITORY_SERVICE_URL}
  internal-api-key: ${INTERNAL_API_KEY}

  pr-review:
    max-files-per-review: ${PR_REVIEW_MAX_FILES}
    max-patch-chars: ${PR_REVIEW_MAX_PATCH_CHARS}
    excluded-filenames: package-lock.json,yarn.lock,pnpm-lock.yaml

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%X{correlationId}] %logger{36} - %msg%n"
