server:
  port: 9000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${FRONTEND_ORIGIN:http://localhost:5173}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
        # More specific ai-service routes must be listed before repository-service's
        # broader /api/repositories/** catch-all — Spring Cloud Gateway matches routes
        # in declaration order, and a catch-all listed first would shadow these forever.
        - id: ai-service
          uri: http://ai-service:8083
          predicates:
            - Path=/api/repositories/*/search,/api/repositories/*/chat,/api/repositories/*/documentation
        - id: repository-service
          uri: http://repository-service:8082
          predicates:
            - Path=/api/repositories/**,/api/pull-requests/**,/api/github/**
        - id: analysis-service
          uri: http://analysis-service:8085
          predicates:
            - Path=/api/analytics/**

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

devmind:
  jwt-secret: ${JWT_SECRET:replace_with_a_long_random_string_min_256_bits}


management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%X{correlationId}] %logger{36} - %msg%n"
