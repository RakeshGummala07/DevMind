server:
  port: 9000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${FRONTEND_ORIGIN}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: ${AUTH_SERVICE_ID}
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/api/auth/**
        - id: ${AI_SERVICE_ID}
          uri: ${AI_SERVICE_URL}
          predicates:
            - Path=/api/repositories/*/search,/api/repositories/*/chat,/api/repositories/*/documentation,/api/repositories/*/documentation/**,/api/repositories/*/analytics/usage,/api/config
        - id: ${REPOSITORY_SERVICE_ID}
          uri: ${REPOSITORY_SERVICE_URL}
          predicates:
            - Path=/api/repositories/**,/api/pull-requests/**,/api/github/**
        - id: ${ANALYSIS_SERVICE_ID}
          uri: ${ANALYSIS_SERVICE_URL}
          predicates:
            - Path=/api/analytics/**
        - id: ${NOTIFICATION_SERVICE_ID}
          uri: ${NOTIFICATION_SERVICE_URL}
          predicates:
            - Path=/api/notifications/**
        - id: ${INGESTION_SERVICE_ID}
          uri: ${INGESTION_SERVICE_URL}
          predicates:
            - Path=/api/ingestion/**

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

devmind:
  jwt-secret: ${JWT_SECRET}


management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%X{correlationId}] %logger{36} - %msg%n"
