server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    table : auth_flyway_schema_history

devmind:
  jwt-secret: ${JWT_SECRET}
  jwt-access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES}
  jwt-refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS}
  github-client-id: ${GITHUB_CLIENT_ID}
  github-client-secret: ${GITHUB_CLIENT_SECRET}
  github-redirect-uri: ${GITHUB_REDIRECT_URI}
  internal-api-key: ${INTERNAL_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always


logging:
  pattern:
    console: "%d{ISO8601} %-5level [%X{correlationId}] %logger{36} - %msg%n"

