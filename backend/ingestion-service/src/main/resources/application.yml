server:
  port: 8084

spring:
  application:
    name: ingestion-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ingestion-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.devmind.ingestionservice.event.IndexEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.devmind.ingestionservice.event

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always

devmind:
  qdrant-url: ${QDRANT_URL}
  qdrant-collection: ${QDRANT_COLLECTION}
  ai-provider: ${AI_PROVIDER}
  ollama-base-url: ${OLLAMA_BASE_URL}
  ai-model: ${AI_MODEL}
  embedding-model: ${EMBEDDING_MODEL}
  embedding-dimensions: ${EMBEDDING_DIMENSIONS}
  auth-service-url: ${AUTH_SERVICE_URL}
  internal-api-key: ${INTERNAL_API_KEY}
  workspace-dir: ${INGESTION_WORKSPACE_DIR}
  max-file-size-bytes: ${MAX_FILE_SIZE_BYTES}
  chunk-lines: ${CHUNK_LINES}
  chunk-overlap-lines: ${CHUNK_OVERLAP_LINES}

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%X{correlationId}] %logger{36} - %msg%n"
