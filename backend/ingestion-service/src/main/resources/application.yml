server:
  port: 8084

spring:
  application:
    name: ingestion-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ingestion-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.devmind.ingestionservice.event.IndexEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.devmind.ingestionservice.event

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always

devmind:
  qdrant-url: ${QDRANT_URL:http://localhost:6333}
  qdrant-collection: ${QDRANT_COLLECTION:devmind_code_chunks}
  ai-provider: ${AI_PROVIDER:ollama}
  ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  ai-model: ${AI_MODEL:llama3.1:8b}
  embedding-model: ${EMBEDDING_MODEL:nomic-embed-text}
  embedding-dimensions: ${EMBEDDING_DIMENSIONS:768}
  auth-service-url: ${AUTH_SERVICE_URL:http://auth-service:8081}
  internal-api-key: ${INTERNAL_API_KEY:replace_with_a_shared_internal_secret}
  workspace-dir: ${INGESTION_WORKSPACE_DIR:/tmp/devmind-ingestion}
  max-file-size-bytes: ${MAX_FILE_SIZE_BYTES:1048576}
  chunk-lines: ${CHUNK_LINES:120}
  chunk-overlap-lines: ${CHUNK_OVERLAP_LINES:15}

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%X{correlationId}] %logger{36} - %msg%n"
