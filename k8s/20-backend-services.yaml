apiVersion: apps/v1
kind: Deployment
metadata: { name: auth-service, namespace: devmind }
spec:
  replicas: 1
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata: { labels: { app: auth-service } }
    spec:
      containers:
        - name: auth-service
          image: devmind/auth-service:latest
          ports: [{ containerPort: 8081 }]
          envFrom: [{ configMapRef: { name: devmind-config } }, { secretRef: { name: devmind-secrets } }]
          readinessProbe: { httpGet: { path: /actuator/health, port: 8081 }, initialDelaySeconds: 20, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: auth-service, namespace: devmind }
spec: { selector: { app: auth-service }, ports: [{ port: 8081, targetPort: 8081 }] }

